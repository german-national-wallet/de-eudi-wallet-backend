[versions]
java = "25"
kotlin = "2.4.10"
detekt = "2.0.0-alpha.6"
spring-boot = "4.1.1"
kotest = "6.2.4"
ktlint = "1.8.0"
aws-sdk = "2.54.4"

[libraries]
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-kafka = { module = "org.springframework.boot:spring-boot-kafka" }
postgresql = { module = "org.postgresql:postgresql" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version = "8.0.4" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "10.9.1" }
bouncycastle-pkix-jdk18 = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.85" }
ngengine-bech32 = { module = "org.ngengine:bech32", version = "1.2.1" }
authlete-http-message-signatures = { module = "com.authlete:http-message-signatures", version = "1.8" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version = "3.1.0" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-data-r2dbc-test = { module = "org.springframework.boot:spring-boot-data-r2dbc-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
springmockk = { module = "com.ninja-squad:springmockk", version = "5.0.1" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
opentelemetry-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version = "2.31.1" }
opentelemetry-spring-boot-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter" }
opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin" }
opentelemetry-samplers = { module = "io.opentelemetry.contrib:opentelemetry-samplers", version = "1.59.0-alpha" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }
projectreactor-reactor-test = { module = "io.projectreactor:reactor-test" }
openapitools-openapidiff-core = { module = "org.openapitools.openapidiff:openapi-diff-core", version = "2.1.7" }
vdurmont-semver4j = { module = "com.vdurmont:semver4j", version = "3.1.0" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version = "1.5.0" }
warden-makoto = { module = "at.asitplus.warden:makoto", version = "1.1.2" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
google-auth-library-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version = "1.51.0" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version = "5.5.0" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
springdoc = { id = "org.springdoc.openapi-gradle-plugin", version = "1.9.0" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
git-properties = { id = "com.gorylenko.gradle-git-properties", version = "4.0.1" }
sonarcube = { id = "org.sonarqube", version = "7.4.0.8496" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.9" }
gatling = { id = "io.gatling.gradle", version = "3.15.1.2" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
